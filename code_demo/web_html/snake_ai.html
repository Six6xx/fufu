<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 AI 贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117; color: #c9d1d9;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    padding: 20px;
  }
  .game {
    background: #161b22; border-radius: 16px; padding: 24px;
    max-width: 480px; width: 100%;
    box-shadow: 0 0 40px rgba(88,166,255,0.1);
    text-align: center;
  }
  h1 { font-size: 22px; color: #58a6ff; margin-bottom: 4px; }
  .sub { color: #484f58; font-size: 13px; margin-bottom: 16px; }
  canvas {
    border: 2px solid #30363d; border-radius: 8px;
    background: #0d1117; display: block; margin: 0 auto;
    width: 400px; height: 400px;
  }
  .info-bar {
    display: flex; justify-content: space-between; margin: 12px 0;
    font-size: 14px; color: #8b949e;
  }
  .info-bar .num { color: #58a6ff; font-weight: bold; font-size: 18px; }
  .status {
    padding: 8px; border-radius: 6px; font-size: 13px; min-height: 36px;
    margin-bottom: 10px;
  }
  .status.playing { color: #3fb950; }
  .status.dead { color: #f85149; }
  .controls { display: flex; gap: 8px; justify-content: center; }
  .controls button {
    padding: 8px 20px; border-radius: 6px; border: none; cursor: pointer;
    font-size: 14px; transition: all 0.2s;
  }
  .btn-start { background: #1f6feb; color: #fff; }
  .btn-start:hover { background: #388bfd; }
  .btn-reset { background: #21262d; color: #8b949e; border: 1px solid #30363d; }
  .btn-reset:hover { background: #30363d; }
  .log {
    margin-top: 12px; padding: 8px; background: #0d1117; border-radius: 6px;
    font-size: 12px; color: #484f58; max-height: 60px; overflow-y: auto;
    text-align: left;
  }
  @media (max-width: 500px) {
    canvas { width: 300px; height: 300px; }
  }
</style>
</head>
<body>
<div class="game">
  <h1>🐍 AI 贪吃蛇</h1>
  <p class="sub">蛇自动朝食物移动 · 简单避障</p>

  <canvas id="canvas" width="400" height="400"></canvas>

  <div class="info-bar">
    <span>🍎 分数 <span class="num" id="score">0</span></span>
    <span>🏆 最高 <span class="num" id="highScore">0</span></span>
    <span>⏱️ 步数 <span class="num" id="steps">0</span></span>
  </div>

  <div class="status playing" id="status">▶ 点击「开始」让 AI 蛇动起来</div>

  <div class="controls">
    <button class="btn-start" id="btnStart">▶ 开始</button>
    <button class="btn-reset" id="btnReset">↺ 重置</button>
  </div>

  <div class="log" id="log"></div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const stepsEl = document.getElementById('steps');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');

const GRID = 20;
const SIZE = 400 / GRID;

// 方向
const DIR = {
  UP: {x: 0, y: -1}, DOWN: {x: 0, y: 1},
  LEFT: {x: -1, y: 0}, RIGHT: {x: 1, y: 0},
};

// 游戏状态
let snake, food, dir, score, highScore, steps, running, alive, gameLoop;
let speed = 120;

function log(msg) {
  logEl.textContent = msg;
}

function init() {
  snake = [{x: 10, y: 10}];
  dir = DIR.RIGHT;
  score = 0;
  steps = 0;
  running = false;
  alive = true;
  highScore = parseInt(localStorage.getItem('snakeAI_high') || '0');
  highScoreEl.textContent = highScore;
  spawnFood();
  draw();
  statusEl.textContent = '▶ 点击「开始」让 AI 蛇动起来';
  statusEl.className = 'status playing';
  log('蛇已就位，等待启动');
}

function spawnFood() {
  let pos;
  do {
    pos = {x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID)};
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function draw() {
  ctx.clearRect(0, 0, 400, 400);

  // 网格
  ctx.strokeStyle = '#1c2333';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= GRID; i++) {
    ctx.beginPath(); ctx.moveTo(i * SIZE, 0); ctx.lineTo(i * SIZE, 400); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * SIZE); ctx.lineTo(400, i * SIZE); ctx.stroke();
  }

  // 食物
  ctx.fillStyle = '#f85149';
  ctx.shadowColor = '#f85149';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(food.x * SIZE + SIZE/2, food.y * SIZE + SIZE/2, SIZE/2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 蛇身
  snake.forEach((seg, i) => {
    const g = Math.max(80, 180 - i * 6);
    ctx.fillStyle = i === 0 ? '#58a6ff' : `rgb(40, ${g}, 130)`;
    const pad = 1, r = 3;
    const x = seg.x * SIZE + pad, y = seg.y * SIZE + pad;
    const w = SIZE - pad*2, h = SIZE - pad*2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fill();
  });

  // 蛇眼
  if (snake.length > 0) {
    const h = snake[0];
    const cx = h.x * SIZE + SIZE/2;
    const cy = h.y * SIZE + SIZE/2;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx + dir.x * 4 - dir.y * 3, cy + dir.y * 4 + dir.x * 3, 2.5, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + dir.x * 4 + dir.y * 3, cy + dir.y * 4 - dir.x * 3, 2.5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#0d1117';
    ctx.beginPath();
    ctx.arc(cx + dir.x * 4 - dir.y * 3, cy + dir.y * 4 + dir.x * 3, 1.2, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + dir.x * 4 + dir.y * 3, cy + dir.y * 4 - dir.x * 3, 1.2, 0, Math.PI*2);
    ctx.fill();
  }
}

// ─── AI 决策 ─────────────────────────────────────────

function isSafe(x, y) {
  if (x < 0 || x >= GRID || y < 0 || y >= GRID) return false;
  return !snake.some(s => s.x === x && s.y === y);
}

function getNextDir() {
  const head = snake[0];
  const dirs = [
    {d: DIR.UP,    name: '↑', dist: Math.abs(head.x - food.x) + Math.abs(head.y - 1 - food.y)},
    {d: DIR.DOWN,  name: '↓', dist: Math.abs(head.x - food.x) + Math.abs(head.y + 1 - food.y)},
    {d: DIR.LEFT,  name: '←', dist: Math.abs(head.x - 1 - food.x) + Math.abs(head.y - food.y)},
    {d: DIR.RIGHT, name: '→', dist: Math.abs(head.x + 1 - food.x) + Math.abs(head.y - food.y)},
  ];

  // 不能回头
  const cannot = {x: -dir.x, y: -dir.y};

  // 按距离食物近→远排序
  dirs.sort((a, b) => a.dist - b.dist);

  // 尝试：先看能不能朝食物走
  for (const item of dirs) {
    const nx = head.x + item.d.x, ny = head.y + item.d.y;
    if (item.d.x === cannot.x && item.d.y === cannot.y) continue;
    if (isSafe(nx, ny)) {
      return item;
    }
  }

  // 没有安全方向能接近食物 → 尝试任意安全方向
  for (const item of [{d: DIR.UP, name: '↑'}, {d: DIR.DOWN, name: '↓'},
                       {d: DIR.LEFT, name: '←'}, {d: DIR.RIGHT, name: '→'}]) {
    if (item.d.x === cannot.x && item.d.y === cannot.y) continue;
    const nx = head.x + item.d.x, ny = head.y + item.d.y;
    if (isSafe(nx, ny)) {
      return {...item, dist: -1};
    }
  }

  return null; // 死路
}

function step() {
  if (!alive || !running) return;

  const decision = getNextDir();
  if (!decision) {
    alive = false;
    clearInterval(gameLoop);
    statusEl.textContent = '💀 蛇被困住了！';
    statusEl.className = 'status dead';
    log(`困死在第 ${steps} 步，得分 ${score}`);
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeAI_high', highScore);
      highScoreEl.textContent = highScore;
    }
    return;
  }

  dir = decision.d;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // 撞墙/撞自身
  if (!isSafe(head.x, head.y)) {
    alive = false;
    clearInterval(gameLoop);
    statusEl.textContent = `💀 撞了！得分 ${score}`;
    statusEl.className = 'status dead';
    log(`撞死在位置(${head.x},${head.y})，第${steps}步`);
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeAI_high', highScore);
      highScoreEl.textContent = highScore;
    }
    return;
  }

  snake.unshift(head);
  steps++;
  stepsEl.textContent = steps;

  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    spawnFood();
    log(`🍎 吃了！得分 ${score}，蛇长 ${snake.length}`);
    // 随分数加快
    if (speed > 50) speed -= 1;
    clearInterval(gameLoop);
    gameLoop = setInterval(step, speed);
  } else {
    snake.pop();
  }

  draw();
}

// ─── 控制 ─────────────────────────────────────────────

function startGame() {
  if (running) return;
  if (!alive) { resetGame(); return; }
  running = true;
  statusEl.textContent = '🧠 AI 蛇正在思考...';
  statusEl.className = 'status playing';
  gameLoop = setInterval(step, speed);
  log('AI 蛇开始觅食！');
}

function resetGame() {
  clearInterval(gameLoop);
  init();
}

document.getElementById('btnStart').addEventListener('click', startGame);
document.getElementById('btnReset').addEventListener('click', resetGame);

init();
</script>
</body>
</html>
